version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shrishti_construction_engineering

    ports:
      - '5434:5432'

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d construction_ledger']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: